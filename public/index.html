<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A Series of Tubes</title>
<meta name="description" content="How the internet actually works, animated one packet at a time.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<script type="module" src="app.js"></script>
</head><body>
<header class="top">
 <a class="brand" href="#journey">A Series of <span>Tubes</span></a>
 <nav class="trail" id="trail" aria-label="Where you are"></nav>
 <details class="menu" id="menu"><summary>All topics</summary><div class="menu-list" id="menuList"></div></details>
</header>
<main class="story">
 <div class="scene-wrap">
  <div class="scene" id="scene">
   <svg id="svg" role="img" aria-label="Animated diagram of the current step"></svg>
   <div class="soonmsg" id="soonmsg" hidden><p>This topic isn’t animated yet.</p><p>Its outline is in the captions.</p></div>
  </div>
  <button class="backout" id="back" hidden></button>
  <div class="pop" id="pop" role="dialog" aria-live="polite" hidden></div>
 </div>
 <div class="captions" id="captions"></div>
</main>
<footer>Sample commands and output use documentation addresses (203.0.113.x, 198.51.100.x). Scroll to step through a topic, or use ← and →. Tap a postcard or envelope to look inside. Esc backs out of a zoom.</footer>
</body></html>
