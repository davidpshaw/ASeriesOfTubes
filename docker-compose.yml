# Runs the published image from Docker Hub. This file works on its own,
# e.g. pasted into Dockhand, Portainer or another compose UI.
#
#   docker compose up -d       → pull and start
#   docker compose pull && docker compose up -d   → update to newest release
#   docker compose down        → stop and remove
#
# To build from source instead (inside a clone of the repo):
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build

services:
  aseriesoftubes:
    image: davidshawcodes/aseriesoftubes:latest
    container_name: aseriesoftubes
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
